name: trusted-review-approval
run-name: review-${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      pull_request:
        required: true
        type: string
      operation_id:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve current inert qualification head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pulls/$PR/reviews" -f event=APPROVE
